name: Pre-Deploy Safety Check

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [master]
    paths:
      - requirements.txt
      - "*.py"
      - "**/*.py"
  pull_request:
    branches: [master]
    paths:
      - requirements.txt
      - "*.py"
      - "**/*.py"

jobs:
  # ── Job 1: CP314 wheel compatibility ─────────────────────────────────────────
  cp314-wheel-check:
    name: CP314 Wheel Validator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install packaging (for SpecifierSet resolution)
        run: pip install packaging --quiet

      - name: Run CP314 wheel validator
        run: python scripts/check_cp314_wheels.py

  # ── Job 2: Wheel-only install + import smoke test ─────────────────────────────
  cloud-install-sim:
    name: Cloud Install Simulation
    runs-on: ubuntu-latest
    needs: cp314-wheel-check   # blocked until Job 1 passes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install requirements (wheel-only — mirrors Streamlit Cloud uv)
        id: install
        run: |
          pip install \
            --only-binary=:all: \
            --no-cache-dir \
            -r requirements.txt && echo "status=pass" >> $GITHUB_OUTPUT \
            || echo "status=fail" >> $GITHUB_OUTPUT

      - name: Core import smoke test
        id: imports
        run: |
          python -c "
          import streamlit, pandas, numpy, scipy, matplotlib, plotly
          import PIL, reportlab, anthropic, xlrd, openpyxl, xlsxwriter
          print('All core imports OK')
          " && echo "status=pass" >> $GITHUB_OUTPUT \
            || echo "status=fail" >> $GITHUB_OUTPUT

      - name: App module import test
        id: app_imports
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          mods = [
              'config.branding_config', 'config.tier_config',
              'core.feature_gate',
              'ui.homepage', 'ui.upload_panel', 'ui.cleaning_options',
              'ui.results_panel', 'utils.session_helpers', 'services.subscription',
          ]
          for m in mods:
              __import__(m)
          print('All app modules imported OK')
          " && echo "status=pass" >> $GITHUB_OUTPUT \
            || echo "status=fail" >> $GITHUB_OUTPUT

      - name: Run pre-deploy orchestrator (generates job summary)
        run: python scripts/predeploy_check.py

      - name: Write CI job summary
        if: always()
        env:
          INSTALL_STATUS: ${{ steps.install.outputs.status }}
          IMPORT_STATUS:  ${{ steps.imports.outputs.status }}
          APP_STATUS:     ${{ steps.app_imports.outputs.status }}
        run: |
          python - <<'PYEOF'
          import os, sys

          install = os.getenv("INSTALL_STATUS", "fail")
          imports = os.getenv("IMPORT_STATUS",  "fail")
          app     = os.getenv("APP_STATUS",     "fail")

          tick = lambda s: "✅ Pass" if s == "pass" else "❌ Fail"

          rows = [
              ("All dependencies have cp314 wheels",    "✅ Pass"),   # Job 1 must pass to reach here
              ("Environment install succeeded",          tick(install)),
              ("App import passed",                     tick(imports)),
              ("App module imports passed",             tick(app)),
          ]

          all_ok = all(r[1] == "✅ Pass" for r in rows)
          verdict = (
              "✅ **READY FOR STREAMLIT CLOUD DEPLOYMENT**"
              if all_ok else
              "🚫 **Deployment blocked — fix requirements.txt before pushing**"
          )

          lines = [
              "## 🛡️ ColtraDataAi Pre-Deploy Report",
              "",
              "| Check | Result |",
              "|---|---|",
          ]
          for label, status in rows:
              lines.append(f"| {label} | {status} |")
          lines += ["", "---", verdict, ""]

          summary_path = os.getenv("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a") as f:
                  f.write("\n".join(lines))
          else:
              print("\n".join(lines))
          PYEOF
