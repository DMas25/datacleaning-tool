name: Pre-Deploy Safety Check

# ── Triggers ──────────────────────────────────────────────────────────────────
# Run whenever requirements.txt or any Python source file changes on master.
# Also runs on all pull requests targeting master.
on:
  push:
    branches: [master]
    paths:
      - requirements.txt
      - "*.py"
      - "**/*.py"
  pull_request:
    branches: [master]
    paths:
      - requirements.txt
      - "*.py"
      - "**/*.py"

jobs:
  # ── Job 1: CP314 wheel compatibility ────────────────────────────────────────
  cp314-wheel-check:
    name: CP314 Wheel Validator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install packaging (for SpecifierSet resolution)
        run: pip install packaging --quiet

      - name: Run CP314 wheel validator
        run: python scripts/check_cp314_wheels.py

  # ── Job 2: Wheel-only install + import smoke test ────────────────────────────
  cloud-install-sim:
    name: Cloud Install Simulation
    runs-on: ubuntu-latest
    needs: cp314-wheel-check   # only run if wheel check passes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install requirements (wheel-only, mirrors uv on Streamlit Cloud)
        run: |
          pip install \
            --only-binary=:all: \
            --no-cache-dir \
            -r requirements.txt

      - name: Core import smoke test
        run: |
          python -c "
          import streamlit, pandas, numpy, scipy, matplotlib, plotly
          import PIL, reportlab, anthropic, xlrd, openpyxl, xlsxwriter
          print('All core imports OK')
          "

      - name: App module import test
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          mods = [
              'config.branding_config', 'config.tier_config',
              'core.feature_gate',
              'ui.homepage', 'ui.upload_panel', 'ui.cleaning_options',
              'ui.results_panel', 'utils.session_helpers', 'services.subscription',
          ]
          for m in mods:
              __import__(m)
          print('All app modules imported OK')
          "

      - name: Run full pre-deploy check
        run: python scripts/predeploy_check.py
