# Render Blueprint — ColtraDataAI Webhook Server
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy steps:
#   1. Push this file to your GitHub repo (root level).
#   2. In Render dashboard → New → Blueprint → connect your repo.
#   3. Render detects this file and creates the service below.
#   4. After creation, set the two secret env vars in the Render dashboard
#      (Environment tab on the service) — they are NOT stored here.
#
# See scripts/deploy_to_render.md for the full deployment checklist.

services:
  - type: web
    name: coltradata-webhook
    runtime: python
    plan: starter          # Starter ($7/mo) — keeps the service always-on.
                           # Free tier sleeps after 15 min and would miss webhooks.
    region: frankfurt      # Closest AWS region to UK customers.

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn services.webhook_server:app --host 0.0.0.0 --port $PORT

    # Render sends GET /health every 30 s. A non-2xx response marks the
    # deploy as unhealthy and triggers an automatic restart.
    healthCheckPath: /health

    envVars:
      # Secret env vars — sync: false means Render will prompt you to enter
      # the value in the dashboard rather than reading it from this file.
      # Never commit real secrets here.

      - key: LEMONSQUEEZY_WEBHOOK_SECRET
        sync: false   # Paste from LemonSqueezy → Settings → Webhooks → signing secret

      - key: DATABASE_URL
        sync: false   # Supabase connection string (Transaction pooler, port 6543)
                      # Format: postgresql://postgres.<ref>:<password>@aws-0-eu-west-2.pooler.supabase.com:6543/postgres

      - key: PYTHON_VERSION
        value: "3.11.0"
