# Render Blueprint — ColtraDataAi
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy steps:
#   1. Push this file to your GitHub repo (root level).
#   2. In Render dashboard → New → Blueprint → connect your repo.
#   3. Render detects this file and creates both services below.
#   4. After creation, set all sync:false env vars in the Render dashboard
#      (Environment tab on each service) — they are NOT stored here.
#
# See scripts/deploy_to_render.md for the full deployment checklist.

services:

  # ── Streamlit app (user-facing) ──────────────────────────────────────────
  - type: web
    name: coltradata-app
    runtime: python
    plan: starter          # Starter ($7/mo) — always-on, no cold starts for users.
    region: frankfurt      # Closest AWS region to UK customers.

    buildCommand: pip install -r requirements.txt
    startCommand: bash run_render.sh

    envVars:
      - key: CREDENTIALS_PASSWORD
        sync: false   # The app login password shown at the sign-in screen

      - key: ADMIN_PASSWORD
        sync: false   # Internal Coltrane staff bypass — grants Enterprise access

      - key: ADMIN_DASHBOARD_PASSWORD
        sync: false

      - key: ADMIN_INSIGHTS_PASSWORD
        sync: false

      - key: ANTHROPIC_API_KEY
        sync: false   # Claude API key — required for AI Advisor feature

      - key: RESEND_API_KEY
        sync: false   # Resend API key — transactional + licence key delivery emails

      - key: APP_URL
        sync: false   # Public URL of this app e.g. https://app.coltradataai.com

      - key: DATABASE_URL
        sync: false   # Supabase connection string (Transaction pooler, port 6543)

      - key: PYTHON_VERSION
        value: "3.11.0"

  # ── Webhook (LemonSqueezy → Supabase) ───────────────────────────────────
  # Replaced by Supabase Edge Function on 2026-07-30.
  # coltradata-webhook Render service was deleted; webhook now handled at:
  # https://sfxtvbxoqyblxkyqmtgl.supabase.co/functions/v1/lemonsqueezy-webhook

  # ── Enterprise API ───────────────────────────────────────────────────────
  - type: web
    name: coltradata-api
    runtime: python
    plan: starter          # Always-on — enterprise customers need zero cold starts.
    region: frankfurt

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_ANON_KEY
        sync: false

      - key: PYTHON_VERSION
        value: "3.11.0"
