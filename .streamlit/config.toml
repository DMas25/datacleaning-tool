[theme]
primaryColor = "#1F4E79"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#1A202C"
font = "sans serif"

[server]
port = 8502
headless = true
runOnSave = true
maxUploadSize = 200

[logger]
level = "info"

[client]
showErrorDetails = true
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
