[theme]
primaryColor = "#1F4E79"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#1A202C"
font = "sans serif"

[server]
headless = true
runOnSave = true
maxUploadSize = 200
enableStaticServing = true

[logger]
level = "info"

[client]
showErrorDetails = true
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
